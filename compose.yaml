services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: kargahyar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: kargahyar
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kargahyar_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kargahyar -d kargahyar"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  kargahyar_pgdata:
